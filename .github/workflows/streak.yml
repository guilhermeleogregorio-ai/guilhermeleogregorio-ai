name: Update Streak Stats

on:
  schedule:
    # Roda automaticamente todos os dias às 00:00 UTC
    - cron: "0 0 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=guilhermeleogregorio-ai&theme=dark&background=000000&border=8A2BE2&stroke=8A2BE2&ring=9D00FF&fire=9D00FF&currStreakNum=FFFFFF&sideNums=FFFFFF&currStreakLabel=9D00FF&sideLabels=FFFFFF&dates=808080
          path: profile/streak.svg

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
